name: Migrate Repos

on:
  workflow_dispatch:
    
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      -name: List Files
       run: |
        ls -R
      - name: Make Script executable
        run: chmod +x scripts/migrate.sh

      - name: Run migration script
        run: ./scripts/migrate.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}