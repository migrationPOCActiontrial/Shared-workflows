name: Tag Approval POC

on:
  workflow_dispatch:

jobs:

  prepare:
    runs-on: ubuntu-latest

    outputs:
      docker_tag: ${{ steps.tag.outputs.docker_tag }}

    steps:
      - name: Set Docker tag
        id: tag
        run: |
          echo "docker_tag=1.0.25" >> "$GITHUB_OUTPUT"

  approval:
    needs: prepare
    runs-on: ubuntu-latest
    environment: approval-test

    steps:
      - name: Show selected tag
        run: |
          echo "Docker tag waiting for approval: ${{ needs.prepare.outputs.docker_tag }}"

  after-approval:
    needs: [prepare, approval]
    runs-on: ubuntu-latest

    steps:
      - name: Use approved tag
        run: |
          echo "Approved Docker tag: ${{ needs.prepare.outputs.docker_tag }}"
