name: Verify Repos

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select operation to perform"
        required: true
        type: choice
        options:
          - "migrate"
          - "verify"

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git Authentication
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          git config --global credential.helper store
          printf "https://daksh03:%s@github.com\n" "$GIT_TOKEN" > ~/.git-credentials

      - name: Test PAT Access
        if: ${{ inputs.action == 'verify' }}
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          curl -sS \
            -H "Authorization: Bearer $GIT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/migrationPOCActiontrial/repo5

      - name: Test Git Access
        if: ${{ inputs.action == 'verify' }}
        run: |
          git ls-remote https://github.com/migrationPOCActiontrial/repo5.git

      - name: Run Migration
        if: ${{ inputs.action == 'migrate' }}
        run: |
          chmod +x ./scripts/migrate.sh
          ./scripts/migrate.sh

      - name: Run Verification
        if: ${{ inputs.action == 'verify' }}
        run: |
          python3 scripts/verify_migration.py
