name: Verify Repos

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select operation to perform"
        required: true
        type: choice
        options:
          - "migrate"
          - "verify"

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Git Authentication
        run: |
          git config --global url."https://daksh03:${{ secrets.GIT_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Test Git Access
        if: ${{ inputs.action == 'verify' }}
        run: |
          git ls-remote https://github.com/migrationPOCActiontrial/repo5.git

      - name: Run Migration
        if: ${{ inputs.action == 'migrate' }}
        run: |
          chmod +x ./scripts/migrate.sh
          ./scripts/migrate.sh

      - name: Run Verification
        if: ${{ inputs.action == 'verify' }}
        run: |
          python3 scripts/verify_migration.py
