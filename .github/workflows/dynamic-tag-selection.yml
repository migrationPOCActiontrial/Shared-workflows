name: Dynamic Tag Selection POC

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read tags JSON
        run: |
          echo "Available Docker tags:"
          cat deployment/tags.json

      - name: Extract tags
        run: |
          jq -r '.tags[]' deployment/tags.json
