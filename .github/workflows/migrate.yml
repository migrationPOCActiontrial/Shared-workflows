name: Migrate Repos

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Make Script executable
        run: chmod +x scripts/migrate.sh

      - name: Run migration script
        run: ./scripts/migrate.sh "{{ secrets.GIT_TOKEN }}"